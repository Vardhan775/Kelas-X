<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .box1{
            background-color: red;
        }
        .box2{
            background-color: yellow;
        }
        .box3{
            background-color: green;
            position: relative;
            top: -100px;
        }
        .container{
            background-color: aqua;
            position: absolute;
            top: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>box1</h1>
        </div>
        <div class="box2">
            <h1>box2</h1>
        </div>
        <div class="box3">
            <h1>box3 box3 box3 box3</h1>
        </div>
    </div>
</body>
</html>
